<mat-drawer-container class="example-container" autosize>
  <mat-toolbar class="custom-toolbar">
    <mat-drawer #drawer class="list-sidenav" mode="side">
      <p>Auto-resizing sidenav</p>
      @if (showFiller) {
      <p>Lorem, ipsum dolor sit amet consectetur.</p>
      }
      <button (click)="showFiller = !showFiller" mat-raised-button>
        Toggle extra text
      </button>
    </mat-drawer>
    <button mat-icon-button class="menu-icon" aria-label="Example icon-button with menu icon" type="button"
      (click)="drawer.toggle()">
      <mat-icon class="text-white">menu</mat-icon>
    </button>
    <span>My App</span>
    <span class="example-spacer"></span>
    <button mat-icon-button class="example-icon favorite-icon custom-icon"
      aria-label="Example icon-button with heart icon">
      <mat-icon class=" text-white">favorite</mat-icon>
    </button>
    <button mat-icon-button class="example-icon custom-icon text-white"
      aria-label="Example icon-button with share icon">
      <mat-icon class="text-white">share</mat-icon>
    </button>
  </mat-toolbar>
</mat-drawer-container>
